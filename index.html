<!doctype html>
<html lang="en" data-theme="light" data-prog="ghr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GHR &amp; DR PLUS Customer Portal · Nirvana Asia Group</title>
<meta name="description" content="Customer portal for GHR (Golden Harvest Reward) and DR PLUS (Durian Reward Plus) holders.">
<meta name="theme-color" content="#1F6B45" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GHR · DR PLUS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --font-ui:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','PingFang SC','Microsoft YaHei',sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --r-sm:8px;--r-md:12px;--r-lg:18px;
  --ok:#17804A;--ok-bg:#DFF3E7;--warn:#9A5B00;--warn-bg:#FCEFD3;--err:#B3261E;--err-bg:#FBE3E0;--info:#1F55A8;--info-bg:#E1EBFA;
  --gold:#C9A24A;
}
[data-theme=light]{
  --bg:#F3F5F2;--surface:#FFFFFF;--surface-2:#F7F9F6;--ink:#14201A;--ink-2:#43514A;--ink-3:#66746C;
  --line:#E0E6E0;--line-2:#CBD5CD;--shadow:0 1px 2px rgba(18,38,28,.06),0 8px 24px -12px rgba(18,38,28,.16);--scrim:rgba(12,22,17,.5);
}
[data-theme=dark]{
  --bg:#0C1210;--surface:#141D18;--surface-2:#19241F;--ink:#E7EFEA;--ink-2:#B0BEB6;--ink-3:#8A9A91;
  --line:#25332B;--line-2:#31423A;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.65);
  --ok:#5BD08F;--ok-bg:#12321F;--warn:#F0B95A;--warn-bg:#3A2B0E;--err:#FF8F86;--err-bg:#3C1815;--info:#8DB7F5;--info-bg:#15264A;
}
[data-prog=ghr]{--acc:#1F6B45;--acc-strong:#15502F;--acc-soft:#E1F1E7;--acc-ink:#0F3A24;--acc-fg:#FFFFFF;--acc-line:#B5D8C3;--acc-glow:#2FA36A}
[data-prog=drp]{--acc:#2159B8;--acc-strong:#17418A;--acc-soft:#E2ECFB;--acc-ink:#0F2E68;--acc-fg:#FFFFFF;--acc-line:#B3C8EE;--acc-glow:#4C8CF0}
[data-theme=dark][data-prog=ghr]{--acc:#4DB37C;--acc-strong:#71CD9A;--acc-soft:#173626;--acc-ink:#C2EAD3;--acc-fg:#07160D;--acc-line:#265239;--acc-glow:#4DB37C}
[data-theme=dark][data-prog=drp]{--bg:#0B1118;--surface:#131B27;--surface-2:#182231;--line:#233149;--line-2:#2F4262;
  --acc:#72A3F7;--acc-strong:#97BBFA;--acc-soft:#16294A;--acc-ink:#C6DAFC;--acc-fg:#06122A;--acc-line:#274677;--acc-glow:#72A3F7}

/* ============ BASE ============ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.012em;font-weight:650}
p{margin:0}
a{color:var(--acc);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px;border-radius:6px}
.noscroll{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--acc);color:var(--acc-fg);padding:10px 14px;border-radius:8px;z-index:200;text-decoration:none}
.skip:focus{top:12px}
.muted{color:var(--ink-3)}.small{font-size:13px}.tiny{font-size:12px}
.ic{flex:none;vertical-align:middle}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.only-m{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ============ BUTTONS / FORMS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;background:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--acc);color:var(--acc-fg)}
.btn-primary:hover{background:var(--acc-strong)}
.btn-ghost{border-color:var(--line-2);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-soft{background:var(--acc-soft);color:var(--acc-ink)}
.btn-soft:hover{border-color:var(--acc-line)}
.btn-danger{border-color:var(--line-2);color:var(--err);background:var(--surface)}
.btn-danger:hover{background:var(--err-bg)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-lg{min-height:54px;padding:0 26px;font-size:16px;border-radius:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.link-btn{background:none;border:0;padding:0;color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
.fld>label,.lbl{font-weight:600;font-size:14px;color:var(--ink)}
.req{color:var(--err)}
.inp{width:100%;font-size:16px;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:var(--ink-3)}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
textarea.inp{min-height:120px;resize:vertical}
.inp[readonly]{background:var(--surface-2);color:var(--ink-2);border-style:dashed}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:52px}
.inp-wrap .eye{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--ink-3);border-radius:10px}
.inp-wrap .eye:hover{color:var(--ink);background:var(--surface-2)}
.hint{font-size:13px;color:var(--ink-3);min-height:0}
.hint:empty{display:none}
.has-err .inp{border-color:var(--err)}
.has-err .hint{color:var(--err);display:flex;gap:6px;align-items:flex-start}
.otp{letter-spacing:.6em;font-size:24px;text-align:center;font-weight:600;padding-left:.6em}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio{position:relative}
.radio input{position:absolute;opacity:0;inset:0;cursor:pointer}
.radio span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:500}
.radio input:checked+span{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.radio input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.switch{position:relative;flex:none;width:48px;height:28px}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+i{background:var(--acc)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.seg-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:0;background:none;font-weight:600;color:var(--ink-2)}
.seg-b.on{background:var(--acc);color:var(--acc-fg);box-shadow:0 2px 8px -2px color-mix(in srgb,var(--acc) 60%,transparent)}
.seg-b:not(.on):hover{background:var(--surface);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.dot-ghr{background:#2FA36A}.dot-drp{background:#4C8CF0}
.pw-rules{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:4px;font-size:13px;color:var(--ink-3)}
.pw-rules li{display:flex;gap:8px;align-items:center}
.pw-rules li.ok{color:var(--ok)}
.pw-rules li i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.pw-rules li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.pw-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 10px}
.pw-bar b{display:block;height:100%;width:0;background:var(--err);transition:width .2s,background .2s}

/* ============ CARDS / BADGES / ALERTS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-p{padding:22px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h h3{font-size:17px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:650;line-height:1.5;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}.b-mute{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.b-mute::before,.b-plain::before{display:none}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid;margin-bottom:18px;font-size:14px}
.alert b{display:block}
.al-err{background:var(--err-bg);border-color:color-mix(in srgb,var(--err) 35%,transparent);color:var(--err)}
.al-warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn)}
.al-info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--info)}
.al-ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.alert>div{color:var(--ink)}
.alert .ic{margin-top:2px}
.alert .btn{margin-top:10px}
.notice{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.notice .ic{margin-top:2px}

/* ============ TABLES ============ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{position:relative;text-align:left;font-weight:600;font-size:13px;color:var(--ink-3);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl th:first-child{border-top-left-radius:12px}.tbl th:last-child{border-top-right-radius:12px}
.tbl td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--acc-soft) 45%,transparent)}
.th-b{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.th-b:hover{color:var(--ink)}
.th-b[data-on=true]{color:var(--acc)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.strong{font-weight:650}

/* ============ SKELETON / EMPTY ============ */
.skel{border-radius:10px;background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 40%,var(--line) 55%);background-size:300% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.empty{text-align:center;padding:44px 20px;display:grid;justify-items:center;gap:10px}
.empty .ring{width:64px;height:64px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;margin-bottom:6px}
.empty h3{font-size:18px}.empty p{max-width:42ch;color:var(--ink-3)}
.empty .btn{margin-top:8px}

/* ============ PUBLIC LANDING ============ */
.pub-h{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pub-h-in{display:flex;align-items:center;gap:20px;min-height:72px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo-t{display:flex;flex-direction:column;line-height:1.05}
.logo-t b{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.01em}
.logo-t small{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.pub-nav{display:flex;gap:4px;margin-left:auto}
.pub-nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:550}
.pub-nav a:hover{background:var(--surface);color:var(--ink)}
.pub-act{display:flex;gap:8px;align-items:center}
.pub-menu{display:none}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--acc-strong) 0%,var(--acc) 62%,color-mix(in srgb,var(--acc-glow) 70%,var(--acc)) 100%);color:#fff;transition:background .4s}
[data-theme=dark] .hero{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 30%,#0b120f) 0%,color-mix(in srgb,var(--acc) 42%,#0b120f) 100%)}
.hero-art{position:absolute;inset:0;opacity:.5;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center;padding:72px 0 84px}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,4.6vw,56px);line-height:1.08;letter-spacing:-.02em;max-width:16em}
.hero .lead{margin-top:20px;font-size:18px;line-height:1.6;max-width:34em;color:rgba(255,255,255,.88)}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero .btn-primary{background:#fff;color:var(--acc-ink)}
.hero .btn-primary:hover{background:#F0F5F2}
.hero .btn-ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);color:#fff}
.hero .btn-ghost:hover{background:rgba(255,255,255,.18)}
.hero-switch{margin-top:36px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.85)}
.hero .seg{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
.hero .seg-b{color:#fff}
.hero .seg-b.on{background:#fff;color:var(--acc-ink);box-shadow:none}
.hero .seg-b:not(.on):hover{background:rgba(255,255,255,.18);color:#fff}
.pv{background:var(--surface);color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 30px 60px -24px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.4)}
.pv-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pv-name{font-weight:650}
.pv-big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:14px 0 2px}
.pv-bars{display:flex;align-items:flex-end;gap:12px;height:110px;margin-top:20px;padding-top:6px;border-top:1px dashed var(--line)}
.pv-bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--ink-3)}
.pv-bars i{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--acc);min-height:8px;transition:height .4s}
.pv-foot{margin-top:14px;font-size:12.5px;color:var(--ink-3)}
.sec{padding:84px 0}
.sec-h{max-width:640px;margin-bottom:36px}
.sec-h h2{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.018em}
.sec-h p{margin-top:12px;color:var(--ink-2);font-size:17px}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{padding:26px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);font-weight:700;margin-bottom:16px}
.step h3{font-size:18px;margin-bottom:6px}.step p{color:var(--ink-2)}
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.news-i{padding:24px;display:flex;flex-direction:column;gap:10px}
.news-i time{font-size:13px;color:var(--ink-3)}
.news-i h3{font-size:18px;line-height:1.3}.news-i p{color:var(--ink-2)}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.gal button{padding:0;border:0;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/3;background:var(--line);grid-column:span 2}
.gal button:nth-child(1),.gal button:nth-child(4){grid-column:span 3}
.gal svg{width:100%;height:100%;display:block;transition:transform .35s}
.gal button:hover svg{transform:scale(1.04)}
.gal span{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;text-align:left;color:#fff;font-weight:600;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.faq{max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:20px 22px;font-weight:650;font-size:17px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .2s;color:var(--ink-3)}
.faq details[open] summary .ic{transform:rotate(180deg)}
.faq details>div{padding:0 22px 22px;color:var(--ink-2);max-width:68ch}
.faq details>div p+p{margin-top:10px}
.help-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:28px;align-items:start}
.contact-list{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.contact-list li{display:flex;gap:14px}
.contact-list .ci{flex:none;width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.contact-list b{display:block;font-size:13px;color:var(--ink-3);font-weight:600}
.contact-list a{font-weight:600}
.foot{background:var(--acc-strong);color:rgba(255,255,255,.85);padding:48px 0 32px;margin-top:0}
[data-theme=dark] .foot{background:var(--surface);border-top:1px solid var(--line)}
.foot .wrap{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.foot a{color:#fff}.foot .logo{color:#fff}.foot .logo-t small{color:rgba(255,255,255,.7)}
.foot small{display:block;margin-top:24px;width:100%;color:rgba(255,255,255,.65)}
.foot-links{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}

/* ============ AUTH ============ */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.auth-side{position:relative;background:linear-gradient(165deg,var(--acc-strong),var(--acc));color:#fff;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
[data-theme=dark] .auth-side{background:linear-gradient(165deg,color-mix(in srgb,var(--acc) 26%,#0b120f),color-mix(in srgb,var(--acc) 40%,#0b120f))}
.auth-side .logo{color:#fff;position:relative}.auth-side .logo-t small{color:rgba(255,255,255,.75)}
.auth-side h2{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,3vw,38px);line-height:1.15;position:relative;max-width:14em}
.auth-side p{margin-top:14px;color:rgba(255,255,255,.85);max-width:30em;position:relative}
.auth-main{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:min(460px,100%)}
.auth-card h1{font-size:28px;margin-bottom:8px}
.auth-card>.muted{margin-bottom:24px}
.auth-top{display:none}
.stepper{display:flex;gap:8px;margin-bottom:28px}
.stepper li{list-style:none;flex:1;display:grid;gap:6px;font-size:12.5px;color:var(--ink-3);font-weight:550}
.stepper{padding:0;margin:0 0 28px}
.stepper li::before{content:"";height:5px;border-radius:9px;background:var(--line-2)}
.stepper li.done::before,.stepper li.cur::before{background:var(--acc)}
.stepper li.cur{color:var(--ink)}
.proto-hint{margin-top:26px;padding:14px 16px;border-radius:14px;border:1px dashed var(--line-2);font-size:13px;color:var(--ink-2);background:var(--surface-2)}
.proto-hint b{color:var(--ink)}
.proto-hint .btn{margin-top:10px}
.center-state{text-align:center;display:grid;justify-items:center;gap:12px}
.center-state .ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.ring-err{background:var(--err-bg);color:var(--err)}.ring-ok{background:var(--ok-bg);color:var(--ok)}

/* ============ APP SHELL ============ */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px;gap:22px}
.side .logo{padding:0 8px}
.side nav{display:grid;gap:4px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:550;position:relative}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:650}
.nav-i.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.side-foot{margin-top:auto;display:grid;gap:12px}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.user-chip div{min-width:0;line-height:1.3}
.user-chip b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip small{color:var(--ink-3);font-size:12.5px}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-weight:700;font-size:14px;border:0}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb-title{font-size:20px;margin-right:auto}
.tb-logo{display:none}
.prog-m{display:none}
.content{width:100%;max-width:1200px;margin:0 auto;padding:28px 32px 56px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:clamp(24px,2.6vw,32px)}
.page-head p{margin-top:6px;color:var(--ink-3)}
.page-head .acts{display:flex;gap:10px;flex-wrap:wrap}
.tabbar{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);width:260px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;z-index:60}
.menu-pop .who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-pop a,.menu-pop button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:0;background:none;text-decoration:none;color:var(--ink);font-weight:550}
.menu-pop a:hover,.menu-pop button:hover{background:var(--surface-2)}
.rel{position:relative}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat{padding:20px}
.stat-h{display:flex;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:14px;font-weight:550}
.stat-i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-style:normal}
.stat-v{font-size:clamp(22px,2.3vw,30px);font-weight:700;letter-spacing:-.02em;margin:12px 0 2px;white-space:nowrap}
.stat-s{font-size:13px;color:var(--ink-3)}
.dash-2{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.chart{position:relative;width:100%;min-height:240px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;transform:translate(-50%,-115%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:13px;white-space:nowrap;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);opacity:0;transition:opacity .12s;z-index:2}
.chart .tip b{display:block;font-size:15px}
.chart .tip.on{opacity:1}
.qa-list{display:grid;gap:12px}
.qa{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
.qa:hover{border-color:var(--acc-line);background:var(--acc-soft)}
.qa .ci{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center}
.qa b{display:block}.qa small{color:var(--ink-3)}
.qa .ic:last-child{margin-left:auto;color:var(--ink-3)}
.banner{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:16px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);margin-bottom:22px;flex-wrap:wrap}
.banner .ic{color:var(--warn)}
.banner div{flex:1;min-width:220px}
.rows{display:grid}
.row{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-3);font-size:14px;font-weight:550}
.row .v{min-width:0;overflow-wrap:anywhere}
.row .v.ro{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-edit{display:grid;gap:10px;grid-column:2/4}
.row-edit .acts{display:flex;gap:8px;flex-wrap:wrap}
.row .fld{margin:0}
.lock{color:var(--ink-3);display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.two-col{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.sort-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sort-row select{width:auto;min-height:40px;padding:6px 12px}
.stmt-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.yr-list{display:grid;gap:8px}
.yr{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.yr.on{border-color:var(--acc);background:var(--acc-soft)}
.yr>button:first-child{flex:1;text-align:left;background:none;border:0;padding:6px 0;font-weight:650;min-height:36px}
.yr small{display:block;font-weight:500;color:var(--ink-3)}
.paper{background:#fff;color:#15211B;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
[data-theme=dark] .paper{border-color:#000}
.paper-h{background:var(--acc);color:var(--acc-fg);padding:28px 32px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
[data-theme=dark] .paper-h{background:#1d5a3a;color:#fff}
[data-theme=dark][data-prog=drp] .paper-h{background:#1d448f}
.paper-h small{opacity:.85;font-size:13px;display:block}
.paper-h h2{font-family:var(--font-display);font-weight:600;font-size:30px}
.paper-b{padding:28px 32px}
.paper dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin:0 0 26px}
.paper dt{font-size:12.5px;color:#66746C}.paper dd{margin:2px 0 0;font-weight:650}
.paper .sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#DDE4DE;border:1px solid #DDE4DE;border-radius:12px;overflow:hidden;margin-bottom:24px}
.paper .sum div{background:#F6F9F6;padding:14px}
.paper .sum span{display:block;font-size:12.5px;color:#66746C}.paper .sum b{font-size:17px}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{text-align:left;font-size:12.5px;color:#66746C;padding:8px 0;border-bottom:1.5px solid #15211B;font-weight:600}
.paper td{padding:10px 0;border-bottom:1px solid #E3E9E4}
.paper .r{text-align:right}
.paper tfoot td{border-bottom:0;border-top:1.5px solid #15211B;font-weight:700;font-size:15px}
.paper .fine{margin-top:22px;font-size:12px;color:#66746C;line-height:1.5}
.paper .badge{background:#DFF3E7;color:#17804A}
.set-sec{margin-bottom:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block}.set-row small{color:var(--ink-3)}
.cert{background:#FBF8EF;color:#2A2618;border-radius:6px;padding:10px;border:1px solid #E5DAB8}
.cert-in{border:2px solid var(--gold);padding:8px;border-radius:2px}
.cert-in>div{border:1px solid var(--gold);padding:28px 24px 24px;text-align:center;display:grid;gap:8px;justify-items:center;background:radial-gradient(circle at 50% 0,#FFFDF6,#F6EFD9)}
.cert h3{font-family:var(--font-display);font-size:26px;font-weight:600;color:#4A3F17}
.cert .holder{font-family:var(--font-display);font-size:30px;font-weight:600;margin:4px 0}
.cert .small{color:#6F6238}
.cert dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin:12px 0 0;text-align:left;width:100%;max-width:420px}
.cert dt{font-size:12px;color:#7A6D3F}.cert dd{margin:0;font-weight:650}
.cert .logo-t b,.cert .logo-t small{color:#2A2618}

/* ============ NOTIFICATIONS ============ */
.nbadge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--err);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--surface)}
.notif-list{display:grid;gap:2px;max-height:min(60vh,480px);overflow:auto;margin:0 -6px}
.notif-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:0;background:none;color:var(--ink);position:relative}
.notif-i:hover{background:var(--surface-2)}
.notif-i.unread{background:var(--acc-soft)}
.notif-i.unread:hover{background:color-mix(in srgb,var(--acc-soft) 75%,var(--surface-2))}
.ni-ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.ni-ic.ni-news{background:var(--info-bg);color:var(--info)}
.ni-b{flex:1;display:grid;gap:2px;min-width:0}
.ni-b b{font-size:14px;font-weight:650;overflow-wrap:anywhere}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none;box-shadow:0 0 0 2px var(--acc-soft)}
.notif-detail p{margin-top:6px;color:var(--ink-2)}

/* ============ ENTITLEMENT SEARCH ============ */
.ent-search-row{display:flex;gap:10px;align-items:center;margin:2px 0 16px;flex-wrap:wrap}
.ent-search{flex:1;min-width:220px}
.ent-search .inp{padding-left:42px}
.ent-search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}

/* ============ MODAL / TOAST / PROTO ============ */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);border-radius:22px;width:min(520px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);border:1px solid var(--line);animation:pop .18s}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.dlg.wide{width:min(720px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px 12px}
.dlg-h h3{font-size:20px}
.dlg-b{padding:8px 22px 22px;overflow:auto}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.toasts{position:fixed;z-index:150;left:50%;transform:translateX(-50%);bottom:24px;display:grid;gap:10px;width:min(440px,calc(100% - 28px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:12px 14px 12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px -8px rgba(0,0,0,.4);animation:pop .2s;font-weight:550}
.toast .ic{flex:none}.toast span{flex:1}
.toast.t-ok .ic{color:#5BD08F}.toast.t-err .ic{color:#FF8F86}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px 6px}
.proto-fab{position:fixed;left:18px;bottom:18px;z-index:90;display:inline-flex;gap:8px;align-items:center;min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:13.5px;color:var(--ink-2)}
.proto-panel{position:fixed;left:18px;bottom:70px;z-index:95;width:min(360px,calc(100% - 36px));max-height:min(78vh,720px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 24px 60px -16px rgba(0,0,0,.45);padding:18px}
.proto-panel h4{font-size:15px;margin-bottom:4px}
.proto-panel h5{font-size:12.5px;color:var(--ink-3);margin:16px 0 6px;font-weight:650}
.proto-panel .set-row{padding:9px 0}
.proto-panel .btn{width:100%;margin-top:6px}
.proto-panel ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:5px}
.sheet-list{display:grid;gap:4px}
.sheet-list a,.sheet-list button{display:flex;gap:12px;align-items:center;min-height:52px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--ink);background:none;border:0;font-weight:600;width:100%;text-align:left}
.sheet-list a:hover,.sheet-list button:hover{background:var(--surface-2)}
.legal h4{margin:16px 0 4px;font-size:15px}.legal p{color:var(--ink-2);font-size:14.5px}

/* ============ RESPONSIVE ============ */
@media (max-width:1100px){
  .shell{grid-template-columns:76px minmax(0,1fr)}
  .side{padding:20px 10px;align-items:center}
  .side .logo-t,.nav-i span,.user-chip div,.side-foot .btn span{display:none}
  .side .logo{padding:0}
  .nav-i{width:52px;justify-content:center;padding:0}
  .nav-i.on::before{left:-10px}
  .user-chip{padding:6px;background:none;border:0}
  .content{padding:24px 22px 48px}.topbar{padding:12px 22px}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-2,.two-col{grid-template-columns:1fr}
  .hero-in{grid-template-columns:1fr;gap:40px;padding:56px 0 64px}
  .stmt-grid{grid-template-columns:1fr}
  .yr-list{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
@media (max-width:860px){
  .steps,.news{grid-template-columns:1fr}
  .help-grid{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}.auth-side{display:none}
  .auth-top{display:block;position:absolute;top:18px;left:20px}
  .auth-main{align-content:start;padding-top:84px}
  .pub-nav{display:none;position:absolute;left:0;right:0;top:72px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px 16px;flex-direction:column;margin:0}
  .pub-nav.open{display:flex}
  .pub-menu{display:inline-grid}
  .pub-act{margin-left:auto}
  .sec{padding:60px 0}
  .gal{grid-template-columns:repeat(2,1fr)}.gal button,.gal button:nth-child(1),.gal button:nth-child(4){grid-column:span 1}
}
@media (max-width:720px){
  body{font-size:15px}
  .shell{display:block}
  .side{display:none}
  .topbar{padding:10px 16px}
  .tb-title{display:none}.tb-logo{display:inline-flex;margin-right:auto}
  .tb-logo .logo-t small{display:none}
  .topbar .prog-d{display:none}
  .prog-m{display:block;position:sticky;top:65px;z-index:25;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .prog-m .seg{display:flex}.prog-m .seg-b{flex:1}
  .content{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{display:grid;justify-items:center;gap:2px;min-height:54px;align-content:center;font-size:11.5px;font-weight:600;text-decoration:none;color:var(--ink-3);background:none;border:0;border-radius:12px}
  .tabbar .on{color:var(--acc);background:var(--acc-soft)}
  .grid-4{gap:10px}.stat{padding:14px}
  .stat-v{font-size:19px;white-space:normal;overflow-wrap:anywhere}
  .card-p{padding:16px}
  .row{grid-template-columns:1fr auto;gap:4px 12px}
  .row .k{grid-column:1/3}.row .v{grid-column:1}.row-edit{grid-column:1/3}
  .two{grid-template-columns:1fr}
  .only-m{display:flex!important}.no-m{display:none!important}
  .rtable thead{display:none}
  .rtable,.rtable tbody,.rtable tr,.rtable td{display:block;width:100%}
  .rtable tr{border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:10px;background:var(--surface)}
  .rtable td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0;border:0;text-align:right}
  .rtable td::before{content:attr(data-label);color:var(--ink-3);font-weight:550;text-align:left;font-size:13.5px}
  .rtable td.act{justify-content:flex-end;flex-wrap:wrap}.rtable td.act::before{display:none}
  .rtable tbody tr:hover td{background:none}
  .paper-h,.paper-b{padding:20px}
  .paper .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .paper table{font-size:13px}
  .ov{align-items:end;padding:0}
  .dlg,.dlg.wide{width:100%;max-height:92vh;border-radius:22px 22px 0 0;animation:sheet .22s}
  @keyframes sheet{from{transform:translateY(40px);opacity:.4}}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .proto-fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));left:12px}
  .proto-panel{left:12px;bottom:calc(126px + env(safe-area-inset-bottom,0px))}
  .hero-in{padding:40px 0 48px}.hero .lead{font-size:16.5px}
  .hero-cta .btn{flex:1}
  .pv-big{font-size:28px}
  .foot .wrap{flex-direction:column}
  .cert dl{grid-template-columns:1fr}
}
@media (max-width:420px){.wrap{width:calc(100% - 32px)}.pub-act .btn-ghost{display:none}}
@media print{
  body *{visibility:hidden}
  .paper,.paper *{visibility:visible}
  .paper{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0;border-radius:0}
  .paper-h{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
'use strict';
/* =====================================================================

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;

function buildPDF(ops){
  const H=842,rgb=h=>[1,3,5].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');
  const esc2=s=>String(s).replace(/•/g,'*').replace(/[–—]/g,'-').replace(/[^\x20-\x7E]/g,'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const wid=(s,sz,f)=>[...s].reduce((a,c)=>a+(/\d/.test(c)?.556:/[.,: ]/.test(c)?.278:/[A-Z]/.test(c)?.68:.52)*(f==='F2'?1.02:f==='F3'?.8:.92),0)*sz;
  let cs='';
  for(const o of ops){
    if(o.t==='r'){ if(o.fill)cs+=`${rgb(o.fill)} rg ${o.x} ${H-o.y-o.h} ${o.w} ${o.h} re f\n`; if(o.stroke)cs+=`${rgb(o.stroke)} RG ${o.lw||1} w ${o.x} ${H-o.y-o.h} ${o.w} ${o.h} re S\n`; }
    else if(o.t==='l'){ cs+=`${rgb(o.c||'#000000')} RG ${o.w||.8} w ${o.x} ${H-o.y} m ${o.x2} ${H-o.y2} l S\n`; }
    else if(o.t==='t'){ const s=esc2(o.s); let x=o.x; const w=wid(s,o.sz,o.f); if(o.al==='r')x-=w; if(o.al==='c')x-=w/2;
      cs+=`BT ${rgb(o.c)} rg /${o.f} ${o.sz} Tf ${x.toFixed(2)} ${H-o.y} Td (${s}) Tj ET\n`; }
  }
  const objs=['','<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${cs.length} >>\nstream\n${cs}endstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>'];
  let out='%PDF-1.4\n';const offs=[];
  for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`;}
  const x=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}

/* ============================ ROUTER ============================ */
const route=()=>{const h=location.hash.replace(/^#\/?/,'');const i=h.indexOf('?');return{path:(i<0?h:h.slice(0,i)).replace(/\/$/,'')};};
const isPriv=p=>NAV.some(n=>n.k===p);
const go=p=>{location.hash='#/'+p;};
let loadTok=0;
function onRoute(){
  closeModal();S.menu=false;S.pubNav=false;
  const {path}=route();
  if(isPriv(path)&&!S.auth){go('login');return;}
  if(path==='register'&&S.lastPath!=='register')S.reg={step:0};
  if((path==='login'||path==='register')&&S.auth){go('dashboard');return;}
  S.lastPath=path;S.loginErr=false;
  if(isPriv(path)&&DATA_VIEWS.includes(path)){S.loading=true;render();const t=++loadTok;setTimeout(()=>{if(t===loadTok){S.loading=false;render();}},420);}
  else{S.loading=false;loadTok++;render();}
  window.scrollTo(0,0);
}
function reload(){S.loading=true;render();const t=++loadTok;setTimeout(()=>{if(t===loadTok){S.loading=false;render();}},420);}
window.addEventListener('hashchange',onRoute);

function applyTheme(){
  const de=document.documentElement;de.dataset.theme=S.theme;de.dataset.prog=S.prog;
  const m=$('#metaTheme');if(m)m.content=S.theme==='dark'?'#0C1210':(S.prog==='ghr'?'#1F6B45':'#2159B8');
}
const TITLES={'':'GHR & DR PLUS Customer Portal',login:'Log in',register:'Register',expired:'Invitation expired','register/expired':'Invitation expired'};
function render(noProto){
  applyTheme();
  const {path}=route();let html,title;
  if(isPriv(path)&&S.auth){html=shell(path);title=NAV.find(n=>n.k===path).t;}
  else{html=publicPage(path);title=TITLES[path]||TITLES[''];}
  $('#app').innerHTML=html;
  document.title=(title===TITLES['']?title:title+' · GHR & DR PLUS Portal');
  if(!noProto)renderProto();
  if($('#chart'))drawChart();
}

function drawChart(){
  const box=$('#chart');if(!box)return;
  const pts=payoutsFor(S.prog).slice().sort((a,b)=>a.year-b.year);if(!pts.length)return;
  const W=Math.max(300,box.clientWidth),H=Math.round(Math.max(230,Math.min(320,W*.4))),m={l:58,r:24,t:18,b:34};
  const kfmt=v=>{let t=(v/1000).toFixed(v%1000?2:0);if(t.includes('.'))t=t.replace(/0+$/,'').replace(/\.$/,'');return t+'k';};
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;};
  const mx=nice(Math.max(...pts.map(p=>p.total))*1.05),iw=W-m.l-m.r,ih=H-m.t-m.b;
  const X=i=>m.l+(pts.length===1?iw/2:i*iw/(pts.length-1)),Y=v=>m.t+ih-(v/mx)*ih;
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.total).toFixed(1)).join(' ');
  const area=line+` L${X(pts.length-1).toFixed(1)} ${m.t+ih} L${X(0).toFixed(1)} ${m.t+ih} Z`;
  let grid='';for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);grid+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)" ${k?'stroke-dasharray="3 5"':''}/><text x="${m.l-10}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--ink-3)">${v>=1000?kfmt(v):v}</text>`;}
  const xl=pts.map((p,i)=>`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="12.5" fill="var(--ink-3)">${p.year}</text>`).join('');
  const dots=pts.map((p,i)=>`<g class="pt" tabindex="0" data-i="${i}" role="img" aria-label="${p.year}: ${RM(p.total)}"><circle cx="${X(i)}" cy="${Y(p.total)}" r="18" fill="transparent"/><circle class="dot-v" cx="${X(i)}" cy="${Y(p.total)}" r="5.5" fill="var(--surface)" stroke="var(--acc)" stroke-width="3"/></g>`).join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="Payout amount by year"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<path d="${area}" fill="url(#ar)"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line id="cross" y1="${m.t}" y2="${m.t+ih}" stroke="var(--acc)" stroke-opacity=".35" stroke-dasharray="4 4" style="display:none"/>${dots}</svg><div class="tip" id="tip"></div>`;
  const svg=$('svg',box),tip=$('#tip',box),cross=$('#cross',box);
  const show=i=>{const p=pts[i];tip.innerHTML=`${p.year}<b>${RM(p.total)}</b>`;tip.style.left=X(i)/W*100+'%';tip.style.top=Y(p.total)+'px';tip.classList.add('on');cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.style.display='';
    $$('.dot-v',svg).forEach((c,j)=>c.setAttribute('r',j===i?7.5:5.5));};
  const hide=()=>{tip.classList.remove('on');cross.style.display='none';$$('.dot-v',svg).forEach(c=>c.setAttribute('r',5.5));};
  svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*(W/r.width);let b=0,bd=1e9;pts.forEach((_,i)=>{const dd=Math.abs(X(i)-px);if(dd<bd){bd=dd;b=i;}});show(b);});
  svg.addEventListener('pointerleave',hide);
  $$('.pt',svg).forEach(g=>{g.addEventListener('focus',()=>show(+g.dataset.i));g.addEventListener('blur',hide);});
}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if($('#chart'))drawChart();},120);});

function filteredSortedFiles(){
  let f=filesFor(S.prog).slice();
  const q=(S.entQuery||'').trim().toLowerCase();
  if(q)f=f.filter(x=>x.no.toLowerCase().includes(q)||x.cert.toLowerCase().includes(q));
  f.sort((a,b)=>S.es==='units'?b.units-a.units:S.es==='cert'?a.cert.localeCompare(b.cert):a.no.localeCompare(b.no));
  return f;
}

  const ro=(k,v)=>`<div class="row"><span class="k">${k}</span><span class="v ro"><span class="strong">${v}</span><span class="lock">${ic('lock',14)} System-generated</span></span><span></span></div>`;
  const ed=(f,label,val,type='text')=>{
    if(S.editing===f){
      const inp=f==='address'?`<textarea class="inp" id="e-${f}" name="${f}" style="min-height:96px">${esc(val)}</textarea>`:`<input class="inp" id="e-${f}" name="${f}" type="${type}" value="${esc(val)}" ${f==='email'?'inputmode="email" autocomplete="email"':f==='phone'?'inputmode="tel" autocomplete="tel"':''}>`;
      return `<div class="row"><span class="k">${label}</span><form class="row-edit" data-form="edit-field" data-f="${f}" novalidate>${fld({name:f,id:'e-'+f,label:'<span class="sr">'+label+'</span>',input:inp,hint:f==='email'&&!S.profileComplete?'Required to finish setting up your profile.':''})}<div class="acts"><button class="btn btn-primary btn-sm" type="submit">Save changes</button><button class="btn btn-ghost btn-sm" type="button" data-act="edit-cancel">Cancel</button></div></form></div>`;
    }
    return `<div class="row"><span class="k">${label}</span><span class="v">${val?esc(val):`<span class="muted">Not added yet</span>`}</span><button class="icon-btn" style="width:40px;height:40px" data-act="edit" data-f="${f}" aria-label="Edit ${label.toLowerCase()}">${ic('pencil',18)}</button></div>`;
  };
  return head('Customer Profile','Your personal, contact and bank details')+
  `${!S.profileComplete?`<div class="alert al-warn" role="status">${ic('alert')}<div><b>Add your email address</b>We need it to finish setting up your account and send you updates.</div></div>`:''}
  <div class="two-col"><div class="card card-p"><div class="card-h"><div><h3>Personal details</h3><p class="small muted">Use the pencil to edit details that can be changed.</p></div></div>
    ${ro('Full name',esc(u.name))}${ro('IC / ID number',u.idMask)}${ed('email','Email',u.email,'email')}${ed('phone','Phone number',u.phone,'tel')}${ed('address','Mailing address',u.address)}</div>
   <div class="card card-p"><div class="card-h"><h3>Bank account</h3></div>
    <div class="rows"><div class="row" style="grid-template-columns:110px 1fr"><span class="k">Bank</span><span class="v strong">${esc(u.bank)}</span></div><div class="row" style="grid-template-columns:110px 1fr"><span class="k">Account</span><span class="v mono strong">${mask4(u.acct)}</span></div></div>
    ${r?`<div class="alert ${r.status==='pending'?'al-warn':'al-ok'}" style="margin:14px 0 0">${ic(r.status==='pending'?'clock':'check')}<div><b>${r.status==='pending'?'Change pending approval':'Change approved'}</b>${esc(r.bank)} ${mask4(r.last4)}<div style="margin-top:6px">${badge(r.status==='pending'?'Pending':'Approved',r.status==='pending'?'warn':'ok')}</div>${r.status==='pending'?'<span class="small muted">Your current account stays active until this is approved.</span>':''}</div></div>`:''}
    <button class="btn btn-ghost btn-block" style="margin-top:16px" data-act="bank-open" ${r&&r.status==='pending'?'disabled':''}>${ic('pencil',18)} Update bank account</button>
    <p class="notice" style="margin-top:12px">${ic('shield',16)}<span>Changing your bank account needs a one-time code sent to your registered phone.</span></p></div></div>`;
}
function bankModal(){
  const b=S.bank;let body='',title='Update bank account';
  if(b.step===1){
    body=`<form data-form="bank-1" novalidate>${fld({name:'bank',label:'New bank',req:1,input:`<select class="inp" id="bank" name="bank"><option value="">Select a bank</option>${BANKS.map(x=>`<option ${b.bank===x?'selected':''}>${x}</option>`).join('')}</select>`})}
    ${fld({name:'acct',label:'New account number',req:1,hint:'Digits only. The account must be in your name.',input:`<input class="inp mono" id="acct" name="acct" inputmode="numeric" autocomplete="off" value="${esc(b.acct||'')}">`})}
    <div class="dlg-f"><button class="btn btn-ghost" type="button" data-act="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Send one-time code</button></div></form>`;
  }else if(b.step===2){
    title='Verify with OTP';
    body=`<p class="muted" style="margin-bottom:16px">Enter the 6-digit code sent to the phone ending in <b class="mono">•••• ${S.user.phone4}</b>.</p>
    <form data-form="bank-otp" novalidate>${fld({name:'code',label:'One-time code',req:1,input:`<input class="inp otp" id="code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">`})}
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px"><button class="link-btn" type="button" id="resend" data-act="resend" disabled>Resend code</button><span class="small">No code? <a href="mailto:${CONTACT.email}?subject=OTP%20not%20received">Email us</a></span></div>
    <div class="proto-hint" style="margin:0 0 14px">Prototype code: <span class="mono">${OTP}</span></div>
    <div class="dlg-f"><button class="btn btn-ghost" type="button" data-act="bank-back">Back</button><button class="btn btn-primary" type="submit">Verify and submit</button></div></form>`;
  }else{
    title='Submitted for approval';
    body=`<div class="center-state" style="padding:10px 0 4px"><div class="ring ring-ok">${ic('check',34)}</div><h3 style="font-size:20px">Your request is pending approval</h3><p class="muted">${esc(b.bank)} ${mask4(b.acct.slice(-4))} will replace your current account once approved. Your current account stays active until then.</p>${badge('Pending','warn')}</div><div class="dlg-f"><button class="btn btn-primary" data-act="close-modal">Done</button></div>`;
  }
  return{title,body};
}

/* ============================ MODAL / TOAST ============================ */
let lastFocus=null;
function openModal(title,body,{wide=false,locked=false}={}){
  lastFocus=document.activeElement;
  $('#modal-root').innerHTML=`<div class="ov" ${locked?'data-locked="1"':''}><div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dlg-h"><h3 id="dlg-t">${title}</h3>${locked?'':`<button class="icon-btn" style="width:40px;height:40px" data-act="close-modal" aria-label="Close">${ic('x',20)}</button>`}</div><div class="dlg-b">${body}</div></div></div>`;
  document.body.classList.add('noscroll');
  const f=$('#modal-root input:not([readonly]),#modal-root select,#modal-root textarea');(f||$('#modal-root .btn-primary')||$('#modal-root .icon-btn'))?.focus?.();
  tickResend();
}
function setModalBody(title,body){const d=$('#modal-root .dlg');if(!d)return;$('#dlg-t').textContent=title;$('.dlg-b',d).innerHTML=body;const f=$('.dlg-b input,.dlg-b select',d);if(f)f.focus();tickResend();}
function closeModal(){if(!$('#modal-root').innerHTML)return;$('#modal-root').innerHTML='';document.body.classList.remove('noscroll');if(lastFocus&&document.contains(lastFocus))lastFocus.focus?.();}
function toast(msg,type='ok',action){
  const el=document.createElement('div');el.className='toast t-'+type;
  el.innerHTML=`${ic(type==='ok'?'check':'alert',20)}<span>${esc(msg)}</span>${action?`<button data-act="${action.act}">${action.label}</button>`:''}`;
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),action?7000:4200);
}
function announce(m){$('#live').textContent=m;}
function sessionModal(){
  openModal('Session expired',`<div class="center-state" style="margin-bottom:14px"><div class="ring ring-err">${ic('lock',30)}</div><p class="muted">For your security, we logged you out after a period of inactivity. Enter your password to continue.</p></div>
  <form data-form="relogin" novalidate>${fld({name:'pw',label:'Password',req:1,id:'rl',input:pwInput('rl','pw','current-password')})}<div class="dlg-f"><button class="btn btn-ghost" type="button" data-act="logout">Log out</button><button class="btn btn-primary" type="submit">Continue</button></div></form>`,{locked:true});
}

/* ============================ EVENTS ============================ */
const V={email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),phone:v=>/^\+?\d{9,13}$/.test(v.replace(/[\s-]/g,''))};
function showErrors(form,errs){
  $$('.fld',form).forEach(f=>{const n=f.dataset.f,m=errs[n],h=$('.hint',f);f.classList.toggle('has-err',!!m);const i=$('input:not([type=radio]),select,textarea',f);if(i)i.setAttribute('aria-invalid',m?'true':'false');
    if(h)h.innerHTML=m?ic('alert',14)+'<span>'+esc(m)+'</span>':esc(f.dataset.hint||'');});
  const first=$('.has-err input,.has-err select,.has-err textarea',form);if(first)first.focus();
  return !Object.keys(errs).length;
}
const fdata=f=>Object.fromEntries(new FormData(f));
const normId=v=>v.replace(/[\s-]/g,'').toUpperCase();
function tickResend(){const b=$('#resend');if(!b)return;const s=Math.max(0,Math.ceil((S.resendAt-Date.now())/1000));b.disabled=s>0;b.textContent=s>0?`Resend code in ${s}s`:'Resend code';}
setInterval(tickResend,1000);
function checkOtp(code){
  if(!/^\d{6}$/.test(code))return{ok:false,msg:'Enter the 6-digit code.'};
  if(S.otp.attempts>=3)return{ok:false,msg:'Too many incorrect attempts. Request a new code to continue.'};
  if(code===OTP){S.otp.attempts=0;return{ok:true};}
  S.otp.attempts++;const left=3-S.otp.attempts;
  return{ok:false,msg:left>0?`That code isn't right. ${left} ${left===1?'attempt':'attempts'} left.`:'Too many incorrect attempts. Request a new code to continue.'};
}
function updatePw(form){
  const v=$('[data-live=pw]',form).value,c=pwCheck(v),n=Object.values(c).filter(Boolean).length;
  $$('#pwrules li',form).forEach(li=>li.classList.toggle('ok',c[li.dataset.r]));
  const b=$('#pwbar',form);if(b){b.style.width=(v?n*25:0)+'%';b.style.background=n<=1?'var(--err)':n<4?'var(--warn)':'var(--ok)';}
}
function doLogin(){S.auth=true;S.loginErr=false;S.loginId='';toast('Welcome back, '+S.user.short,'ok');go('dashboard');}

const FORMS={
  login(f){const d=fdata(f),e={};
    if(!d.id.trim())e.id='Enter your IC, passport or company registration number.';if(!d.pw)e.pw='Enter your password.';
    if(Object.keys(e).length)return showErrors(f,e);
    const ok=['850412145678','A12345678'].includes(normId(d.id))&&d.pw===S.user.pw;
    if(!ok){S.loginErr=true;S.loginId=d.id;render();$('#lpw')?.focus();return;}
    doLogin();},
  'reg-id'(f){const d=fdata(f);const ok=['850412145678','A12345678'].includes(normId(d.id||''));
    if(!ok)return showErrors(f,{id:"We couldn't match this number to your invitation. Check it and try again, or contact us."});
    S.reg.step=2;S.otp.attempts=0;S.resendAt=Date.now()+30000;render();tickResend();},
  'reg-otp'(f){const d=fdata(f),r=checkOtp((d.code||'').trim());if(!r.ok)return showErrors(f,{code:r.msg});S.reg.step=3;render();},
  'reg-pw'(f){const d=fdata(f),e={},c=pwCheck(d.pw||'');
    if(!Object.values(c).every(Boolean))e.pw='Your password doesn\'t meet all the rules below.';
    if(d.pw!==d.pw2)e.pw2="The passwords don't match.";
    if(Object.keys(e).length)return showErrors(f,e);
    S.user.pw=d.pw;S.reg.step=4;render();
    setTimeout(()=>{S.auth=true;S.reg={step:0};S.user.email='';S.profileComplete=false;S.editing='email';toast("You're registered and logged in",'ok');go('profile');},1300);},
  contact(f){const d=fdata(f),e={};
    if(!d.name.trim())e.name='Enter your name.';
    if(!d.email.trim())e.email='Enter your email address.';else if(!V.email(d.email.trim()))e.email='Enter a valid email address, like name@example.com.';
    if(!d.phone.trim())e.phone='Enter your phone number.';else if(!V.phone(d.phone))e.phone='Enter a valid phone number, like 012-345 6789.';
    if(!d.category)e.category='Select an enquiry category.';
    if(!d.message.trim())e.message='Tell us how we can help.';
    if(!showErrors(f,e))return;
    const c={no:'ENQ-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*900000)+100000),email:d.email.trim()};
    const host=f.closest('.form-host');host.innerHTML=contactSuccess(c);S.contactDone=S.auth?null:null;announce('Enquiry sent. Your enquiry number is '+c.no);host.querySelector('button')?.focus();},
  'edit-field'(f){const k=f.dataset.f,d=fdata(f),v=(d[k]||'').trim(),e={};
    if(k==='email'){if(!v)e.email='Enter your email address.';else if(!V.email(v))e.email='Enter a valid email address, like name@example.com.';}
    if(k==='phone'){if(!v)e.phone='Enter your phone number.';else if(!V.phone(v))e.phone='Enter a valid phone number, like 012-345 6789.';}
    if(k==='address'&&!v)e.address='Enter your mailing address.';
    if(!showErrors(f,e))return;
    S.user[k]=v;if(k==='phone')S.user.phone4=v.replace(/\D/g,'').slice(-4);S.editing=null;
    const was=!S.profileComplete;if(k==='email'&&was)S.profileComplete=true;
    toast(({email:'Email',phone:'Phone number',address:'Mailing address'})[k]+' updated','ok');
    if(was&&k==='email'){setTimeout(()=>toast('Profile complete. Welcome aboard.','ok'),600);}
    render();},
  'bank-1'(f){const d=fdata(f),e={};const a=(d.acct||'').replace(/[\s-]/g,'');
    if(!d.bank)e.bank='Select your bank.';if(!a)e.acct='Enter your account number.';else if(!/^\d{8,16}$/.test(a))e.acct='Account numbers are 8 to 16 digits.';
    if(!showErrors(f,e))return;
    S.bank={step:2,bank:d.bank,acct:a};S.otp.attempts=0;S.resendAt=Date.now()+30000;const m=bankModal();setModalBody(m.title,m.body);},
  'bank-otp'(f){const d=fdata(f),r=checkOtp((d.code||'').trim());if(!r.ok)return showErrors(f,{code:r.msg});
    S.bankReq={bank:S.bank.bank,last4:S.bank.acct.slice(-4),status:'pending'};S.bank.step=3;const m=bankModal();setModalBody(m.title,m.body);render();},
  chpw(f){const d=fdata(f),e={},c=pwCheck(d.nw||'');
    if(d.cur!==S.user.pw)e.cur="That isn't your current password.";
    if(!Object.values(c).every(Boolean))e.nw="Your new password doesn't meet all the rules below.";else if(d.nw===d.cur)e.nw='Choose a password different from your current one.';
    if(d.nw!==d.cf)e.cf="The passwords don't match.";
    if(!showErrors(f,e))return;
    S.user.pw=d.nw;toast('Password changed','ok');render();},
  relogin(f){const d=fdata(f);if(d.pw!==S.user.pw)return showErrors(f,{pw:"That password isn't right. Try again."});closeModal();toast('Welcome back','ok');}
};

const ACT={
  prog(a){const p=a.dataset.p;if(S.prog===p)return;S.prog=p;S.stmtYear=null;S.entQuery='';announce('Showing '+DATA[p].full);
    if(S.auth&&isPriv(route().path)){applyTheme();if(DATA_VIEWS.includes(route().path))reload();else render();}else render();},

  logout(){closeModal();S.auth=false;S.menu=false;S.editing=null;location.hash='#/';S.loading=false;render();toast("You've been logged out",'ok');},

  more(){openModal('More',`<div class="sheet-list"><a href="#/profile">${ic('user',22)} Customer Profile</a><a href="#/contact">${ic('mail',22)} Contact Us</a><a href="#/settings">${ic('settings',22)} Settings</a><button data-act="logout">${ic('logout',22)} Log out</button></div>`);},
  pubnav(){S.pubNav=!S.pubNav;render();},
  jump(a,e){e.preventDefault();S.pubNav=false;const t=document.getElementById(a.dataset.t);if(location.hash!=='#/'&&location.hash!==''){location.hash='#/';setTimeout(()=>document.getElementById(a.dataset.t)?.scrollIntoView(),50);return;}
    if($('.pub-nav.open'))render();(document.getElementById(a.dataset.t)||t)?.scrollIntoView({behavior:'smooth',block:'start'});},
  lightbox(a){const g=GALLERY.find(x=>x.p===+a.dataset.i);openModal(g.t,`<div style="border-radius:14px;overflow:hidden;aspect-ratio:4/3">${scene(g.p,g.t)}</div><p class="small muted" style="margin-top:10px">Placeholder artwork.</p>`,{wide:true});},
  legal(a,e){e.preventDefault();legalModal(a.dataset.t);},
  'close-modal'(){closeModal();},
  pw(a){const i=document.getElementById(a.dataset.t);const show=i.type==='password';i.type=show?'text':'password';a.innerHTML=ic(show?'eyeoff':'eye',20);a.setAttribute('aria-label',show?'Hide password':'Show password');},
  autofill(){$('#id').value='850412-14-5678';$('#lpw').value=DEMO_PW;},
  'reg-next'(){S.reg.step=1;render();},
  resend(){S.otp.attempts=0;S.resendAt=Date.now()+30000;tickResend();toast('A new code has been sent','ok');},
  retry(){S.sim.error=false;reload();},
  'retry-dl'(){S.lastDl&&S.lastDl();},
  'sort-po'(a){const k=a.dataset.k;S.ps=S.ps.k===k?{k,d:-S.ps.d}:{k,d:-1};render();},
  'po-detail'(a){poDetail(+a.dataset.y);},
  'cert-view'(a){certView(a.dataset.f);},
  'cert-first'(){const f=filesFor(S.prog);if(!f.length){toast('No certificates to show yet','err');return;}if(f.length===1)certView(f[0].no);else{toast('Choose a file to view its certificate','ok');go('entitlement');}},
  'cert-dl'(a){const f=dprog().files.find(x=>x.no===a.dataset.f);if(!f)return;if(S.sim.certFail){closeModal();certView(f.no);return;}
    download(()=>pdfCert(S.prog,f),`E-Certificate-${dprog().code}-${f.cert}.pdf`);},
  'stmt-year'(a){S.stmtYear=+a.dataset.y;render();},
  'stmt-dl'(a){const y=+a.dataset.y;download(()=>pdfStatement(S.prog,y),`E-Statement-${dprog().code}-${y}.pdf`);},
  'stmt-print'(){window.print();},
  edit(a){S.editing=a.dataset.f;render();$('#e-'+a.dataset.f)?.focus();},
  'edit-cancel'(){S.editing=null;render();},
  'bank-open'(){S.bank={step:1};const m=bankModal();openModal(m.title,m.body);},
  'bank-back'(){S.bank.step=1;const m=bankModal();setModalBody(m.title,m.body);},
  'contact-reset'(){S.contactDone=null;const h=$('.form-host');if(h)h.innerHTML=contactForm({});},
  proto(){S.proto=!S.proto;renderProto();},
  'sim-session'(){S.proto=false;renderProto();sessionModal();},
  'sim-approve'(){if(S.bankReq){S.bankReq.status='approved';S.user.bank=S.bankReq.bank;S.user.acct=S.bankReq.last4;toast('Bank account change approved','ok');render();}},
  'notif-open'(){S.notifView=null;const m=notifModal();openModal(m.title,m.body);},
  'notif-view'(a){S.notifView=a.dataset.id;const m=notifModal();setModalBody(m.title,m.body);render();},
  'notif-back'(){S.notifView=null;const m=notifModal();setModalBody(m.title,m.body);render();},
  'ent-clear'(){S.entQuery='';render();$('[data-input=ent-search]')?.focus();},
};
function saveTheme(){try{localStorage.setItem('portal-theme',S.theme);}catch(e){}}

document.addEventListener('click',e=>{
  const ov=e.target.closest('.ov');if(ov&&e.target===ov&&!ov.dataset.locked){closeModal();return;}
  const a=e.target.closest('[data-act]');
  if(!a){if(S.menu&&!e.target.closest('.menu-pop')){S.menu=false;render();}return;}
  const fn=ACT[a.dataset.act];if(fn){if(a.tagName==='A'&&a.dataset.act!=='jump'&&a.dataset.act!=='legal')return;fn(a,e);}
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f);});
document.addEventListener('input',e=>{
  if(e.target.matches('[data-live=pw]'))updatePw(e.target.form);
  const fl=e.target.closest('.fld.has-err');if(fl){fl.classList.remove('has-err');const h=$('.hint',fl);if(h)h.innerHTML=esc(fl.dataset.hint||'');}
  if(e.target.matches('.otp'))e.target.value=e.target.value.replace(/\D/g,'');
  if(e.target.matches('[data-input=ent-search]')){
    S.entQuery=e.target.value;
    const box=$('#ent-results');if(box)box.innerHTML=entResultsHTML();
    const btn=$('#ent-clear-btn');if(btn)btn.disabled=!S.entQuery.trim();
  }
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.change;if(!k)return;
  if(k==='sort-ent'){S.es=t.value;render();}
  else if(k==='sort-po-sel'){const[a,b]=t.value.split(':');S.ps={k:a,d:+b};render();}
  else if(k==='notif'){S.notif[t.dataset.k]=t.checked;toast((t.dataset.k==='payout'?'Payout':'News')+' notifications '+(t.checked?'on':'off'),'ok');}
  else if(k==='sim'){S.sim[t.dataset.k]=t.checked;const p=route().path;if(isPriv(p)&&S.auth)render(true);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const ov=$('.ov');if(ov&&!ov.dataset.locked){closeModal();}else if(S.proto){S.proto=false;renderProto();}else if(S.menu){S.menu=false;render();}}
  if(e.key==='Tab'){const d=$('#modal-root .dlg');if(d){const f=$$('button:not([disabled]),input:not([disabled]),select,textarea,a[href]',d);if(f.length){const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}}
});

/* ---------- boot ---------- */
applyTheme();
if(!location.hash)history.replaceState(null,'',location.pathname+'#/');
onRoute();
</script>
</body>
</html>
